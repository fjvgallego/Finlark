name: CI

# NFR-009: the build and the tests run on every push. See docs/adr/0011-build-and-ci.md.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: scripts/lint.sh

  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild test \
            -project Finlark.xcodeproj \
            -scheme Finlark \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            CODE_SIGNING_ALLOWED=NO
